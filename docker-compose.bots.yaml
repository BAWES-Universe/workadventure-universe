services:
  bot-server:
    build:
      context: .
      dockerfile: bots/Dockerfile
    command: npm run dev
    working_dir: /usr/src/app/bots
    volumes:
      - .:/usr/src/app
    environment:
      SENTRY_DSN_BOT: ${SENTRY_DSN_BOT:-}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-}
      PUSHER_URL: ${PUSHER_URL:-http://play.workadventure.localhost}
      ADMIN_API_URL: ${ADMIN_API_URL:-}
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN}
      BOT_SERVICE_TOKEN: ${BOT_SERVICE_TOKEN}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      WORKADVENTURE_URL: ws://pusher:8080
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB_NUMBER: 1
      BOT_SERVER_PORT: 3001
      BOT_SERVER_ID: ${BOT_SERVER_ID:-server-1}
      SECRET_KEY: ${SECRET_KEY}
      ENABLE_MOVEMENT_LOGGING: "true"
      ENABLE_BOT_DEBUG: "true"
      NODE_ENV: development
      POSTHOG_API_KEY: ${POSTHOG_API_KEY:-}
      POSTHOG_HOST: ${POSTHOG_HOST:-https://eu.posthog.com}
    depends_on:
      - redis
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.bot-server.rule=Host(`bot-server.workadventure.localhost`)"
      - "traefik.http.routers.bot-server.entryPoints=web"
      - "traefik.http.routers.bot-server.service=bot-server"
      - "traefik.http.services.bot-server.loadbalancer.server.port=3001"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

