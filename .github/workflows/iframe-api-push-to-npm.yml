name: Push @BAWES-Universe/iframe-api-typings to NPM
on:
  release:
    types: [created]
  push:
    branches:
      - universe
      - master
    paths:
      - 'play/src/iframe_api.ts'
      - 'play/packages/iframe-api-typings/**'
      - 'play/tsconfig-for-iframe-api-typings.json'
      - '.github/workflows/iframe-api-push-to-npm.yml'

permissions:
  id-token: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Setup .npmrc file to publish to npm
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Replace version number
        run: 'sed -i "s#0.0.0-version-placeholder#${{ github.ref_name }}#g" package.json'
        working-directory: "play/packages/iframe-api-typings"

      - name: Debug package.json
        run: cat package.json
        working-directory: "play/packages/iframe-api-typings"

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          version: '3.x'

      - name: "Install dependencies"
        run: npm ci

      - name: "Install messages dependencies"
        run: npm ci
        working-directory: "messages"

      - name: "Build proto messages"
        run: npm run ts-proto
        working-directory: "messages"

      - name: "Generate i18n files"
        run: npm run typesafe-i18n
        working-directory: "play"

      - name: "Build"
        run: npm run build-typings
        env:
          PUSHER_URL: "//localhost:3000"
          ADMIN_URL: "//localhost:80"
        working-directory: "play"

      - name: "Verify API surface"
        run: |
          grep -q "WorkAdventureApi" play/packages/iframe-api-typings/play/src/iframe_api.d.ts || \
            (echo "ERROR: WorkAdventureApi missing from generated types" && exit 1)

      - name: Publish package
        run: npm publish
        working-directory: "play/packages/iframe-api-typings"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        if: ${{ github.event_name == 'release' }}
