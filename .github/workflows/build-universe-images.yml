name: Build Universe Images for Coolify

on:
  push:
    # universe-develop builds feed the dev server (images tagged universe-develop and
    # universe-develop-<sha>). Release and deploy below stay gated on refs/heads/universe, and
    # `latest` is only tagged on the default branch, so a universe-develop build never reaches prod.
    branches: [universe, universe-develop]
    paths:
      - 'play/**'
      - 'back/**'
      - 'map-storage/**'
      - 'uploader/**'
      - 'discord-bot/**'
      - 'bots/**'
      - 'voice-worker/**'
      - 'libs/**'
      - 'messages/**'
      - '.github/workflows/build-universe-images.yml'
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to build (play, back, map-storage, uploader, discord-bot, bot-server, voice-worker, or all)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - play
          - back
          - map-storage
          - uploader
          - discord-bot
          - bot-server
          - voice-worker
      rollback_tag:
        description: 'Roll production back to a release tag (vX.Y.Z) or image tag (universe-<sha7>); leave empty for a normal build'
        required: false
        default: ''
        type: string

# Serialise runs per ref. Two pushes to `universe` inside one run's window both computed the
# same next version (get-version reads the latest tag at the start of a run, the tag is only
# written at the end of it), so the second run skipped its tag while its images had already
# been pushed to :latest / :universe. Waiting instead of racing means the second run reads the
# first run's tag and computes the following version.
# cancel-in-progress MUST stay false: true could cancel a release between `git push origin
# "$VERSION"` and `gh release create`, leaving a tag with no release behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Least privilege by default. Without a workflow-level block every job inherits the
# repository default token, which is broader than anything here needs. Jobs that need more
# declare it themselves: the builds widen to packages: write, the release job to contents:
# write, and the deploy job to deployments: write for recording the deployment.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  # Change this to your GitHub username or organization
  IMAGE_PREFIX: ${{ github.repository_owner }}

jobs:
  # ─────────────────────────────────────────────────
  # Version: single source of truth for both the
  # release tag and the version baked into the images
  # ─────────────────────────────────────────────────
  get-version:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.rollback_tag == '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      new_version: ${{ steps.calculate.outputs.new_version }}
      release_version: ${{ steps.calculate.outputs.release_version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Calculate next version and what gets baked
        id: calculate
        run: |
          PKG_VERSION=$(cat VERSION)
          # Anchored stable semver only. The glob is looser than it looks: [0-9]* means
          # "a digit followed by anything", so it also matches a prerelease such as
          # v0.2.70-rc.1, whose suffix then breaks the arithmetic below with a shell error.
          LATEST_TAG=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | awk '/^v[0-9]+\.[0-9]+\.[0-9]+$/' | head -1)
          LATEST_VERSION="${LATEST_TAG#v}"

          echo "VERSION file: $PKG_VERSION"
          echo "Latest tag:   $LATEST_TAG"

          if [ -z "$LATEST_TAG" ]; then
            NEW_VERSION="$PKG_VERSION"
          elif [ "$PKG_VERSION" = "$LATEST_VERSION" ]; then
            IFS='.' read -r MAJOR MINOR PATCH <<< "$PKG_VERSION"
            NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
          elif [ "$(printf '%s\n' "$PKG_VERSION" "$LATEST_VERSION" | sort -V | tail -1)" = "$PKG_VERSION" ]; then
            # VERSION is ahead of latest tag — use VERSION (user bumped it)
            NEW_VERSION="$PKG_VERSION"
          else
            # VERSION is behind latest tag — bump from tag instead
            IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST_VERSION"
            NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi

          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

          # What gets baked into the images (RELEASE_VERSION).
          # Only a real release — a push to universe — may claim the next semver: a
          # workflow_dispatch build is never released, and a later release would reuse that
          # same number, so an unreleased image must be identifiable as <branch>@<sha>.
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/universe" ]; then
            RELEASE_VERSION="v${NEW_VERSION}"
          else
            RELEASE_VERSION="${GITHUB_REF_NAME//\//-}@${GITHUB_SHA::7}"
          fi

          echo "release_version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "Baking release version: $RELEASE_VERSION"

  build-play:
    needs: get-version
    if: ${{ github.event.inputs.service == 'all' || github.event.inputs.service == 'play' || github.event.inputs.service == 'bot-server' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/play-universe
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./play/Dockerfile.universe
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            NODE_OPTIONS=--max-old-space-size=16384
            FAST_BUILD=${{ (github.event_name != 'push' || github.ref != 'refs/heads/universe') && 'true' || '' }}
            RELEASE_VERSION=${{ needs.get-version.outputs.release_version }}
            SENTRY_URL=
            SENTRY_AUTH_TOKEN=
            SENTRY_ORG=
            SENTRY_PROJECT=
            SENTRY_ENVIRONMENT=
          cache-from: type=gha,scope=play
          cache-to: type=gha,mode=max,scope=play

  build-back:
    needs: get-version
    if: ${{ github.event.inputs.service == 'all' || github.event.inputs.service == 'back' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/back-universe
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./back/Dockerfile.universe
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            RELEASE_VERSION=${{ needs.get-version.outputs.release_version }}
          cache-from: type=gha,scope=back
          cache-to: type=gha,mode=max,scope=back

  build-map-storage:
    needs: get-version
    if: ${{ github.event.inputs.service == 'all' || github.event.inputs.service == 'map-storage' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/map-storage-universe
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./map-storage/Dockerfile.universe
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            RELEASE_VERSION=${{ needs.get-version.outputs.release_version }}
          cache-from: type=gha,scope=map-storage
          cache-to: type=gha,mode=max,scope=map-storage

  build-uploader:
    needs: get-version
    if: ${{ github.event.inputs.service == 'all' || github.event.inputs.service == 'uploader' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/uploader-universe
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./uploader/Dockerfile.universe
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            RELEASE_VERSION=${{ needs.get-version.outputs.release_version }}
          cache-from: type=gha,scope=uploader
          cache-to: type=gha,mode=max,scope=uploader

  build-discord-bot:
    needs: get-version
    if: ${{ github.event.inputs.service == 'all' || github.event.inputs.service == 'discord-bot' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/discord-bot-universe
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./discord-bot
          file: ./discord-bot/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            RELEASE_VERSION=${{ needs.get-version.outputs.release_version }}
          cache-from: type=gha,scope=discord-bot
          cache-to: type=gha,mode=max,scope=discord-bot

  build-bot-server:
    # Waits for play so that if play's build fails, bot-server is skipped too. Bots only connect
    # to a play with the same API version, so a new bot image must not ship without its play.
    # (Both images compute that version from the same source, so the order itself isn't what
    # makes them match.)
    needs: [get-version, build-play]
    if: ${{ github.event.inputs.service == 'all' || github.event.inputs.service == 'bot-server' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/bot-server-universe
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./bots/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            RELEASE_VERSION=${{ needs.get-version.outputs.release_version }}
          cache-from: type=gha,scope=bot-server
          cache-to: type=gha,mode=max,scope=bot-server


  build-voice-worker:
    # Not in the release's needs on purpose: a voice-worker build that fails must never hold back a
    # game release. The deploy job deploys the worker only when this build succeeded.
    needs: get-version
    if: ${{ github.event.inputs.service == 'all' || github.event.inputs.service == 'voice-worker' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/voice-worker-universe
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./voice-worker
          file: ./voice-worker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=voice-worker
          cache-to: type=gha,mode=max,scope=voice-worker

  # ─────────────────────────────────────────────────
  # Release: tag and GitHub Release (the version itself
  # comes from get-version, which also feeds RELEASE_VERSION)
  # Runs only on push to universe (not PRs)
  # ─────────────────────────────────────────────────
  release:
    if: github.ref == 'refs/heads/universe' && github.event_name == 'push'
    needs: [get-version, build-play, build-back, build-map-storage, build-uploader, build-discord-bot, build-bot-server]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      new_version: ${{ needs.get-version.outputs.new_version }}
      created: ${{ steps.create_release.outputs.created }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create tag and release
        id: create_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VERSION: ${{ needs.get-version.outputs.new_version }}
        run: |
          VERSION="v${NEW_VERSION}"

          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists — skipping"
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "BAWES Bot"
          git config user.email "bot@bawes.net"
          git tag "$VERSION"
          git push origin "$VERSION"

          gh release create "$VERSION" --generate-notes
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Create Sentry release
        if: steps.create_release.outputs.created == 'true'
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          NEW_VERSION: ${{ needs.get-version.outputs.new_version }}
        run: |
          npx -y @sentry/cli@3.4.3 releases new "v${NEW_VERSION}" \
            --org bawes-co \
            --project universe-back \
            --project universe-play \
            --project universe-map-storage \
            --project universe-maps \
            --project universe-uploader \
            --project universe-bot \
            --project universe-discord-bot
          npx -y @sentry/cli@3.4.3 releases set-commits "v${NEW_VERSION}" --auto --org bawes-co

  # ─────────────────────────────────────────────────
  # Dev server: a fresh universe-develop build goes on
  # dev.bawes.net, unless a PR holds dev (`on-dev` label).
  # See dev-server.yml.
  # ─────────────────────────────────────────────────
  dev-server-check:
    # The voice server build is waited for so dev never redeploys its old image, but it is not
    # required: like on prod, a failed voice server build never holds back the game apps. The
    # explicit results replace the implicit "every need succeeded" that !cancelled() switches off.
    if: >-
      ${{ !cancelled() && github.ref == 'refs/heads/universe-develop' && github.event_name == 'push'
      && needs.build-play.result == 'success' && needs.build-back.result == 'success'
      && needs.build-map-storage.result == 'success' && needs.build-uploader.result == 'success'
      && needs.build-bot-server.result == 'success' }}
    needs: [build-play, build-back, build-map-storage, build-uploader, build-bot-server, build-voice-worker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      free: ${{ steps.check.outputs.free }}
      voice_worker: ${{ needs.build-voice-worker.result == 'success' }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEV_TOKEN_SET: ${{ secrets.DEV_COOLIFY_TOKEN != '' }}
        run: |
          set -euo pipefail
          if [ "$DEV_TOKEN_SET" != true ]; then
            echo "DEV_COOLIFY_TOKEN is not set yet; skipping the dev server."
            echo "free=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          held=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --label on-dev --json number --jq 'length')
          if [ "$held" = 0 ]; then free=true; else free=false; echo "A PR holds on-dev; dev stays on it."; fi
          echo "free=$free" >> "$GITHUB_OUTPUT"

  dev-server:
    needs: dev-server-check
    if: needs.dev-server-check.outputs.free == 'true'
    permissions:
      contents: read
      packages: read
      pull-requests: write
    uses: ./.github/workflows/dev-server-switch.yml
    with:
      tag: universe-develop
      # false when this run's voice server image did not build: dev's voice server is left alone.
      voice_worker: ${{ needs.dev-server-check.outputs.voice_worker }}
      # Checked again inside the switch lock: a PR may take on-dev while this run waits.
      mode: free
    secrets:
      DEV_COOLIFY_TOKEN: ${{ secrets.DEV_COOLIFY_TOKEN }}

  # ─────────────────────────────────────────────────
  # Deploy: trigger Coolify to pull new images
  # Fires only if release produced a new version
  # ─────────────────────────────────────────────────
  deploy:
    # always(): the voice-worker build is not part of the release, so its failure must not skip this job.
    if: ${{ always() && needs.release.outputs.created == 'true' }}
    needs: [release, build-voice-worker]
    runs-on: ubuntu-latest
    # Seven services one after another, each waited on up to 20 minutes (140 in the worst case).
    timeout-minutes: 170
    # Recording the deployment uses the deployments API; nothing here reads repository files.
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Deploy all universe services to Coolify
        env:
          COOLIFY_BASE: ${{ secrets.COOLIFY_BASE }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_PLAY_UUID: ${{ secrets.COOLIFY_PLAY_UUID }}
          COOLIFY_BACK_UUID: ${{ secrets.COOLIFY_BACK_UUID }}
          COOLIFY_MAP_STORAGE_UUID: ${{ secrets.COOLIFY_MAP_STORAGE_UUID }}
          COOLIFY_BOT_SERVER_UUID: ${{ secrets.COOLIFY_BOT_SERVER_UUID }}
          COOLIFY_DISCORD_BOT_UUID: ${{ secrets.COOLIFY_DISCORD_BOT_UUID }}
          COOLIFY_UPLOADER_UUID: ${{ secrets.COOLIFY_UPLOADER_UUID }}
          COOLIFY_VOICE_WORKER_UUID: ${{ secrets.COOLIFY_VOICE_WORKER_UUID }}
          VOICE_WORKER_BUILT: ${{ needs.build-voice-worker.result == 'success' }}
          NEW_VERSION: ${{ needs.release.outputs.new_version }}
        run: |
          # Coolify answering "queued" only means it took the job. A service counts as deployed once its
          # deployment reads "finished"; the services go one at a time because six big image pulls at once
          # failed on the host (v0.3.18: play and map-storage never started and the old version kept serving).
          deploy_one() {
            name="$1"; uuid="$2"
            if ! queued=$(curl -sSf --max-time 60 -X POST "${COOLIFY_BASE}/api/v1/deploy?uuid=${uuid}" \
              -H "Authorization: Bearer ${COOLIFY_TOKEN}"); then
              echo "::error::Coolify did not accept the deploy for $name"
              return 1
            fi
            deployment=$(echo "$queued" | jq -r '.deployments[0].deployment_uuid // empty')
            if [ -z "$deployment" ]; then
              echo "::error::Coolify gave no deployment to follow for $name"
              return 1
            fi
            echo "$name: deployment $deployment queued"
            last=""
            end=$((SECONDS + 1200))
            while [ "$SECONDS" -lt "$end" ]; do
              sleep 10
              # A refused or missing read (401, 403, 404) will not get better: stop. Any other failed read
              # (network blip, 5xx while Coolify restarts) is not a failed deploy: keep waiting.
              code=$(curl -s --max-time 30 -o "$RUNNER_TEMP/coolify-status.json" -w '%{http_code}' \
                "${COOLIFY_BASE}/api/v1/deployments/${deployment}" \
                -H "Authorization: Bearer ${COOLIFY_TOKEN}") || code=000
              case "$code" in
                401|403|404)
                  # 403 usually means the token may start deploys but lacks the Coolify "read" permission.
                  echo "::error::$name: Coolify answered $code when reading deployment $deployment (COOLIFY_TOKEN needs the read permission)"
                  return 1 ;;
              esac
              status=""
              if [ "$code" = "200" ]; then status=$(jq -r '.status // empty' "$RUNNER_TEMP/coolify-status.json" || true); fi
              if [ -n "$status" ] && [ "$status" != "$last" ]; then
                echo "$name: $status"
                last="$status"
              fi
              case "$status" in
                finished) return 0 ;;
                failed|cancelled-by-user)
                  echo "::error::$name did not deploy: Coolify deployment $deployment is $status"
                  return 1 ;;
              esac
            done
            echo "::error::$name did not finish within 20 minutes (Coolify deployment $deployment, last status: ${last:-unknown})"
            return 1
          }

          # The services play talks to go first, so a new play never starts against an old back or map-storage.
          echo "Deploying v${NEW_VERSION}..."
          failed=""
          for service in \
            "back ${COOLIFY_BACK_UUID}" \
            "map-storage ${COOLIFY_MAP_STORAGE_UUID}" \
            "play ${COOLIFY_PLAY_UUID}" \
            "voice-worker ${COOLIFY_VOICE_WORKER_UUID:-unset}" \
            "bot-server ${COOLIFY_BOT_SERVER_UUID}" \
            "discord-bot ${COOLIFY_DISCORD_BOT_UUID}" \
            "uploader ${COOLIFY_UPLOADER_UUID}"; do
            # shellcheck disable=SC2086
            set -- $service
            # play is the only service that depends on the ones before it: never start it against an old back or map-storage.
            if [ "$1" = "play" ] && [ -n "$failed" ]; then
              echo "::error::play not deployed: it needs${failed} deployed first"
              failed="$failed play"
              continue
            fi
            # The voice worker goes just before the bot server, which connects to it. It never fails the
            # game deploy: without it voice bots answer in text.
            if [ "$1" = "voice-worker" ]; then
              if [ "$VOICE_WORKER_BUILT" != true ]; then
                echo "::warning::voice-worker not deployed: its image did not build in this run"
              elif [ "$2" = "unset" ]; then
                echo "::warning::voice-worker not deployed: COOLIFY_VOICE_WORKER_UUID is not set"
              else
                deploy_one "$1" "$2" || echo "::warning::voice-worker did not deploy; voice bots answer in text until it does"
              fi
              continue
            fi
            deploy_one "$1" "$2" || failed="$failed $1"
          done
          # The other services are still attempted; the job fails at the end if any did not finish.
          if [ -n "$failed" ]; then
            echo "::error::Not deployed:$failed"
            exit 1
          fi
          echo "All services deployed."

      - name: Verify universe.bawes.net health after deploy
        env:
          PROD_URL: https://universe.bawes.net
        run: |
          set -euo pipefail
          # Confirm the public front/pusher HTTP endpoint (/ping -> "pong"), the pusher-to-back
          # gRPC health endpoint (/ping-backs -> "pong"), and /server.json all answer after
          # Coolify finishes switching the containers. Retry for up to 2 minutes while Traefik
          # routes traffic to the newly started containers.
          check_endpoint() {
            path="$1"; expected="$2"
            end=$((SECONDS + 120))
            last_code="000"
            last_body=""
            while [ "$SECONDS" -lt "$end" ]; do
              code=$(curl -sS --max-time 15 -o "$RUNNER_TEMP/health-body.txt" -w '%{http_code}' \
                "${PROD_URL}${path}" 2>/dev/null) || code="000"
              body=""
              if [ -f "$RUNNER_TEMP/health-body.txt" ]; then
                body=$(cat "$RUNNER_TEMP/health-body.txt")
              fi
              if [ "$code" = "200" ] && { [ -z "$expected" ] || [ "$body" = "$expected" ]; }; then
                echo "${PROD_URL}${path}: HTTP 200 (${expected:-ok})"
                return 0
              fi
              last_code="$code"
              last_body="$body"
              sleep 10
            done
            echo "::error::Health check failed for ${PROD_URL}${path} (last HTTP ${last_code}, body: ${last_body:0:120})"
            return 1
          }

          check_endpoint "/ping" "pong"
          check_endpoint "/ping-backs" "pong"
          check_endpoint "/server.json" ""
          if ! jq -e '.domain and .version' "$RUNNER_TEMP/health-body.txt" >/dev/null 2>&1; then
            echo "::error::${PROD_URL}/server.json did not return valid server metadata"
            exit 1
          fi
          echo "Production health checks passed for ${PROD_URL}."

      - name: Record GitHub deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VERSION: ${{ needs.release.outputs.new_version }}
        run: |
          DEPLOY_ID=$(printf '{"ref":"%s","environment":"production","description":"v%s","required_contexts":[]}' "$GITHUB_REF_NAME" "$NEW_VERSION" | \
            gh api "repos/$GITHUB_REPOSITORY/deployments" --input - --jq '.id')
          gh api "repos/$GITHUB_REPOSITORY/deployments/${DEPLOY_ID}/statuses" \
            -f state=success \
            -f environment_url=https://universe.bawes.net \
            -f "log_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Mark Sentry deployment
        if: needs.release.outputs.created == 'true'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          NEW_VERSION: ${{ needs.release.outputs.new_version }}
        run: |
          npx -y @sentry/cli@3.4.3 releases deploys "v${NEW_VERSION}" new -e production --org bawes-co

  # ─────────────────────────────────────────────────
  # Rollback: re-point :universe and :latest in GHCR
  # to a previous release's universe-<sha7> images,
  # redeploy in Coolify, and verify health.
  # ─────────────────────────────────────────────────
  rollback:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/universe' && inputs.rollback_tag != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 170
    permissions:
      contents: read
      packages: write
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve rollback image tag
        id: resolve
        env:
          ROLLBACK_TAG: ${{ inputs.rollback_tag }}
        run: |
          set -euo pipefail
          raw=$(printf '%s' "$ROLLBACK_TAG" | tr -d '[:space:]')
          if [[ "$raw" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            rel_tag="v${raw#v}"
            if ! full_sha=$(git rev-parse --verify --quiet "refs/tags/${rel_tag}^{commit}"); then
              echo "::error::Release tag '${rel_tag}' was not found in repository tags"
              exit 1
            fi
            image_tag="universe-${full_sha::7}"
            label="${rel_tag} (${image_tag})"
          elif [[ "$raw" =~ ^universe-[0-9a-f]{7,40}$ ]]; then
            sha_part="${raw#universe-}"
            image_tag="universe-${sha_part::7}"
            label="$image_tag"
          else
            echo "::error::Invalid rollback_tag '$raw'. Use a release tag (e.g. v0.3.18) or an immutable production image tag (e.g. universe-15a5ef8)."
            exit 1
          fi
          echo "Resolved rollback target: $label -> $image_tag"
          echo "image_tag=$image_tag" >> "$GITHUB_OUTPUT"
          echo "label=$label" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify and retag production images in GHCR
        id: retag
        env:
          IMAGE_TAG: ${{ steps.resolve.outputs.image_tag }}
        run: |
          set -euo pipefail
          owner=$(printf '%s' "$IMAGE_PREFIX" | tr '[:upper:]' '[:lower:]')
          services="back map-storage play bot-server discord-bot uploader"

          # Verify every required service image exists for the target tag before mutating :universe or :latest.
          for svc in $services; do
            src="${REGISTRY}/${owner}/${svc}-universe:${IMAGE_TAG}"
            if ! docker buildx imagetools inspect "$src" >/dev/null; then
              echo "::error::Rollback aborted: image $src does not exist in GHCR"
              exit 1
            fi
            echo "Verified $src"
          done

          voice_available=false
          voice_src="${REGISTRY}/${owner}/voice-worker-universe:${IMAGE_TAG}"
          if docker buildx imagetools inspect "$voice_src" >/dev/null 2>&1; then
            voice_available=true
            echo "Verified $voice_src"
          else
            echo "::warning::$voice_src not found in GHCR; voice-worker will be skipped during rollback"
          fi
          echo "voice_worker=$voice_available" >> "$GITHUB_OUTPUT"

          for svc in $services; do
            repo="${REGISTRY}/${owner}/${svc}-universe"
            docker buildx imagetools create \
              -t "${repo}:universe" \
              -t "${repo}:latest" \
              "${repo}:${IMAGE_TAG}"
            echo "Retagged ${repo}:universe and :latest -> ${IMAGE_TAG}"
          done

          if [ "$voice_available" = true ]; then
            repo="${REGISTRY}/${owner}/voice-worker-universe"
            docker buildx imagetools create \
              -t "${repo}:universe" \
              -t "${repo}:latest" \
              "${repo}:${IMAGE_TAG}"
            echo "Retagged ${repo}:universe and :latest -> ${IMAGE_TAG}"
          fi

      - name: Redeploy rolled-back services in Coolify
        env:
          COOLIFY_BASE: ${{ secrets.COOLIFY_BASE }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_PLAY_UUID: ${{ secrets.COOLIFY_PLAY_UUID }}
          COOLIFY_BACK_UUID: ${{ secrets.COOLIFY_BACK_UUID }}
          COOLIFY_MAP_STORAGE_UUID: ${{ secrets.COOLIFY_MAP_STORAGE_UUID }}
          COOLIFY_BOT_SERVER_UUID: ${{ secrets.COOLIFY_BOT_SERVER_UUID }}
          COOLIFY_DISCORD_BOT_UUID: ${{ secrets.COOLIFY_DISCORD_BOT_UUID }}
          COOLIFY_UPLOADER_UUID: ${{ secrets.COOLIFY_UPLOADER_UUID }}
          COOLIFY_VOICE_WORKER_UUID: ${{ secrets.COOLIFY_VOICE_WORKER_UUID }}
          VOICE_WORKER_AVAILABLE: ${{ steps.retag.outputs.voice_worker }}
          ROLLBACK_LABEL: ${{ steps.resolve.outputs.label }}
        run: |
          deploy_one() {
            name="$1"; uuid="$2"
            if ! queued=$(curl -sSf --max-time 60 -X POST "${COOLIFY_BASE}/api/v1/deploy?uuid=${uuid}" \
              -H "Authorization: Bearer ${COOLIFY_TOKEN}"); then
              echo "::error::Coolify did not accept the rollback deploy for $name"
              return 1
            fi
            deployment=$(echo "$queued" | jq -r '.deployments[0].deployment_uuid // empty')
            if [ -z "$deployment" ]; then
              echo "::error::Coolify gave no deployment to follow for $name"
              return 1
            fi
            echo "$name: rollback deployment $deployment queued"
            last=""
            end=$((SECONDS + 1200))
            while [ "$SECONDS" -lt "$end" ]; do
              sleep 10
              code=$(curl -s --max-time 30 -o "$RUNNER_TEMP/coolify-status.json" -w '%{http_code}' \
                "${COOLIFY_BASE}/api/v1/deployments/${deployment}" \
                -H "Authorization: Bearer ${COOLIFY_TOKEN}") || code=000
              case "$code" in
                401|403|404)
                  echo "::error::$name: Coolify answered $code when reading deployment $deployment (COOLIFY_TOKEN needs the read permission)"
                  return 1 ;;
              esac
              status=""
              if [ "$code" = "200" ]; then status=$(jq -r '.status // empty' "$RUNNER_TEMP/coolify-status.json" || true); fi
              if [ -n "$status" ] && [ "$status" != "$last" ]; then
                echo "$name: $status"
                last="$status"
              fi
              case "$status" in
                finished) return 0 ;;
                failed|cancelled-by-user)
                  echo "::error::$name did not roll back: Coolify deployment $deployment is $status"
                  return 1 ;;
              esac
            done
            echo "::error::$name did not finish within 20 minutes (Coolify deployment $deployment, last status: ${last:-unknown})"
            return 1
          }

          echo "Rolling production back to ${ROLLBACK_LABEL}..."
          failed=""
          for service in \
            "back ${COOLIFY_BACK_UUID}" \
            "map-storage ${COOLIFY_MAP_STORAGE_UUID}" \
            "play ${COOLIFY_PLAY_UUID}" \
            "voice-worker ${COOLIFY_VOICE_WORKER_UUID:-unset}" \
            "bot-server ${COOLIFY_BOT_SERVER_UUID}" \
            "discord-bot ${COOLIFY_DISCORD_BOT_UUID}" \
            "uploader ${COOLIFY_UPLOADER_UUID}"; do
            # shellcheck disable=SC2086
            set -- $service
            if [ "$1" = "play" ] && [ -n "$failed" ]; then
              echo "::error::play not deployed: it needs${failed} deployed first"
              failed="$failed play"
              continue
            fi
            if [ "$1" = "voice-worker" ]; then
              if [ "$VOICE_WORKER_AVAILABLE" != true ]; then
                echo "::warning::voice-worker not deployed: rollback tag has no voice-worker image"
              elif [ "$2" = "unset" ]; then
                echo "::warning::voice-worker not deployed: COOLIFY_VOICE_WORKER_UUID is not set"
              else
                deploy_one "$1" "$2" || echo "::warning::voice-worker did not deploy; voice bots answer in text until it does"
              fi
              continue
            fi
            deploy_one "$1" "$2" || failed="$failed $1"
          done
          if [ -n "$failed" ]; then
            echo "::error::Not rolled back:$failed"
            exit 1
          fi
          echo "All services rolled back to ${ROLLBACK_LABEL}."

      - name: Verify universe.bawes.net health after rollback
        env:
          PROD_URL: https://universe.bawes.net
        run: |
          set -euo pipefail
          check_endpoint() {
            path="$1"; expected="$2"
            end=$((SECONDS + 120))
            last_code="000"
            last_body=""
            while [ "$SECONDS" -lt "$end" ]; do
              code=$(curl -sS --max-time 15 -o "$RUNNER_TEMP/health-body.txt" -w '%{http_code}' \
                "${PROD_URL}${path}" 2>/dev/null) || code="000"
              body=""
              if [ -f "$RUNNER_TEMP/health-body.txt" ]; then
                body=$(cat "$RUNNER_TEMP/health-body.txt")
              fi
              if [ "$code" = "200" ] && { [ -z "$expected" ] || [ "$body" = "$expected" ]; }; then
                echo "${PROD_URL}${path}: HTTP 200 (${expected:-ok})"
                return 0
              fi
              last_code="$code"
              last_body="$body"
              sleep 10
            done
            echo "::error::Post-rollback health check failed for ${PROD_URL}${path} (last HTTP ${last_code}, body: ${last_body:0:120})"
            return 1
          }

          check_endpoint "/ping" "pong"
          check_endpoint "/ping-backs" "pong"
          check_endpoint "/server.json" ""
          if ! jq -e '.domain and .version' "$RUNNER_TEMP/health-body.txt" >/dev/null 2>&1; then
            echo "::error::${PROD_URL}/server.json did not return valid server metadata"
            exit 1
          fi
          echo "Post-rollback health checks passed for ${PROD_URL}."

      - name: Record GitHub rollback deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ROLLBACK_LABEL: ${{ steps.resolve.outputs.label }}
        run: |
          DEPLOY_ID=$(printf '{"ref":"%s","environment":"production","description":"Rollback to %s","required_contexts":[]}' "$GITHUB_REF_NAME" "$ROLLBACK_LABEL" | \
            gh api "repos/$GITHUB_REPOSITORY/deployments" --input - --jq '.id')
          gh api "repos/$GITHUB_REPOSITORY/deployments/${DEPLOY_ID}/statuses" \
            -f state=success \
            -f environment_url=https://universe.bawes.net \
            -f "log_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
