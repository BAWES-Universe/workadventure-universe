name: Universe PR Validation

# PR validation for the `universe` branch.
# Runs typecheck, lint, and unit tests on `play`, `back`, `map-storage`.
# Mobile CI lives in `mobile-ci.yml`.
# Full Playwright integration tests run after image builds via
# `test-universe-images.yml`.
on:
  pull_request:
    branches: [universe]
  push:
    branches: [universe]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-play:
    name: Play (typecheck, lint, unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          version: '3.x'

      - name: Install dependencies (play workspace)
        run: npm ci --workspace=workadventure-play

      - name: Install messages deps
        run: npm ci
        working-directory: messages

      - name: Build proto messages
        run: npm run ts-proto
        working-directory: messages

      - name: Generate i18n
        run: npm run typesafe-i18n
        working-directory: play

      - name: Typecheck
        run: npm run typecheck
        working-directory: play

      - name: Svelte check
        run: npm run svelte-check
        working-directory: play

      - name: Lint
        run: npm run lint
        working-directory: play

      - name: Unit tests
        run: npm test
        working-directory: play

  ci-back:
    name: Back (typecheck, lint, unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          version: '3.x'

      - name: Install dependencies (back workspace)
        run: npm ci --workspace=workadventureback

      - name: Install messages deps
        run: npm ci
        working-directory: messages

      - name: Build proto messages
        run: npm run ts-proto
        working-directory: messages

      - name: Typecheck
        run: npm run typecheck
        working-directory: back

      - name: Lint
        run: npm run lint
        working-directory: back

      - name: Unit tests
        run: npm test
        working-directory: back

  ci-map-storage:
    name: Map-storage (typecheck, lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (map-storage workspace)
        run: npm ci --workspace=workadventuremapstorage

      - name: Typecheck
        run: npm run typecheck
        working-directory: map-storage

      - name: Lint
        run: npm run lint
        working-directory: map-storage
