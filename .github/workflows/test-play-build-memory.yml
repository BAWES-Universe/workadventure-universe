name: Test play prod build memory (temporary)

# Temporary: runs the full prod play build (legacy browsers on) on the free runner with different memory settings.
# Never pushes an image. Deleted before the fix is merged.
on:
  push:
    branches: [claude/project-thread-yhfwg0]
    paths:
      - '.github/workflows/test-play-build-memory.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: v1-nomaps-control
            maps: "false"
            split: ""
            swap: "0"
            heap: "16384"
          - name: v2-hiddenmaps-swap
            maps: "hidden"
            split: ""
            swap: "1"
            heap: "30720"
          - name: v3-hiddenmaps-split
            maps: "hidden"
            split: "true"
            swap: "0"
            heap: "16384"
          - name: v4-hiddenmaps-split-swap
            maps: "hidden"
            split: "true"
            swap: "1"
            heap: "30720"
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v6

      - name: Disk and memory before
        run: |
          df -h / /mnt || true
          free -m
          swapon --show || true

      - name: Add swap
        if: matrix.swap == '1'
        run: |
          # Put the swap file on whichever disk has more room, leave 8 GB for Docker.
          ROOT_AVAIL=$(df --output=avail -BG / | tail -1 | tr -dc 0-9)
          MNT_AVAIL=$(df --output=avail -BG /mnt | tail -1 | tr -dc 0-9)
          if [ "$MNT_AVAIL" -gt "$ROOT_AVAIL" ]; then DIR=/mnt; AVAIL=$MNT_AVAIL; else DIR=/; AVAIL=$ROOT_AVAIL; fi
          SIZE=$(( AVAIL - 8 )); [ "$SIZE" -gt 32 ] && SIZE=32
          echo "swap on $DIR: ${SIZE}G (avail ${AVAIL}G)"
          sudo swapoff -a || true
          sudo fallocate -l ${SIZE}G "${DIR%/}/swapfile"
          sudo chmod 600 "${DIR%/}/swapfile"
          sudo mkswap "${DIR%/}/swapfile"
          sudo swapon "${DIR%/}/swapfile"
          swapon --show
          free -m

      - name: Memory sampler
        run: |
          nohup bash -c 'while true; do echo "$(date +%H:%M:%S) $(free -m | awk "/Mem:/{printf \"ram_used=%sMB avail=%sMB \", \$3, \$7} /Swap:/{printf \"swap_used=%sMB\", \$3}")"; sleep 60; done' > /tmp/mem.log 2>&1 &

      - uses: docker/setup-buildx-action@v4

      - name: Build play (prod flags, no push)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./play/Dockerfile.universe
          push: false
          outputs: type=cacheonly
          build-args: |
            NODE_OPTIONS=--max-old-space-size=${{ matrix.heap }}
            FAST_BUILD=
            GENERATE_SOURCEMAP=${{ matrix.maps }}
            SPLIT_VENDOR=${{ matrix.split }}
            RELEASE_VERSION=v0.5.0-test
            SENTRY_URL=
            SENTRY_AUTH_TOKEN=
            SENTRY_ORG=
            SENTRY_PROJECT=
            SENTRY_ENVIRONMENT=

      - name: Peak memory
        if: always()
        run: |
          echo "--- samples (every 60 s) ---"
          cat /tmp/mem.log | awk 'NR%5==1' | tail -40
          echo "--- peak ---"
          sort -t= -k2 -n -r /tmp/mem.log | head -1 || true
