name: Rollback Universe Deploy

# Manually roll universe.bawes.net back to a known-good image tag.
#
# Process:
# 1. Operator finds the desired SHA in the GHCR package list:
#      https://github.com/BAWES-Universe/workadventure-universe/pkgs/container/play-universe
# 2. Triggers this workflow from the Actions tab with the target SHA.
# 3. Workflow re-tags `ghcr.io/BAWES-Universe/<svc>-universe:universe-<sha>` as
#    `ghcr.io/BAWES-Universe/<svc>-universe:universe` so Coolify pulls it as
#    the new "current" image.
# 4. Coolify webhook is fired and a /ping health check confirms the rollback.
#
# Required secrets (same as deploy-universe.yml):
#   COOLIFY_WEBHOOK_URL   - Coolify deploy webhook
#   COOLIFY_WEBHOOK_TOKEN - optional bearer token
#   DISCORD_WEBHOOK_URL   - optional notification channel
on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: 'Short or full commit SHA to roll back to (must already exist in GHCR as universe-<sha>)'
        required: true
      reason:
        description: 'Reason for rollback (will be posted to Discord)'
        required: false
        default: 'manual rollback'

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}
  SERVICES: play back map-storage uploader

jobs:
  rollback:
    name: Re-tag GHCR + trigger Coolify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify target images exist
        env:
          SHA: ${{ github.event.inputs.target_sha }}
        run: |
          set -e
          for svc in $SERVICES; do
            image="$REGISTRY/$IMAGE_PREFIX/$svc-universe:universe-$SHA"
            echo "Checking $image"
            docker manifest inspect "$image" > /dev/null
          done

      - name: Re-tag universe-<sha> as universe (rollback pointer)
        env:
          SHA: ${{ github.event.inputs.target_sha }}
        run: |
          set -e
          for svc in $SERVICES; do
            src="$REGISTRY/$IMAGE_PREFIX/$svc-universe:universe-$SHA"
            dst="$REGISTRY/$IMAGE_PREFIX/$svc-universe:universe"
            echo "Re-tagging $src -> $dst"
            docker buildx imagetools create --tag "$dst" "$src"
          done

      - name: Trigger Coolify deploy
        env:
          WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
          WEBHOOK_TOKEN: ${{ secrets.COOLIFY_WEBHOOK_TOKEN }}
          SHA: ${{ github.event.inputs.target_sha }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "::warning::COOLIFY_WEBHOOK_URL not set — manual Coolify deploy required."
            exit 0
          fi
          AUTH_HEADER=()
          if [ -n "$WEBHOOK_TOKEN" ]; then
            AUTH_HEADER=(-H "Authorization: Bearer $WEBHOOK_TOKEN")
          fi
          curl -fsSL -X POST "${AUTH_HEADER[@]}" \
            -H "Content-Type: application/json" \
            --data "{\"sha\":\"$SHA\",\"rollback\":true}" \
            "$WEBHOOK_URL"

      - name: Wait + health check
        id: health
        run: |
          set +e
          sleep 30
          deadline=$((SECONDS + 300))
          while [ $SECONDS -lt $deadline ]; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 https://universe.bawes.net/ping)
            echo "ping HTTP $code"
            if [ "$code" = "200" ]; then
              echo "result=success" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 15
          done
          echo "result=failure" >> "$GITHUB_OUTPUT"
          exit 1

      - name: Notify Discord
        if: always()
        env:
          DISCORD_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          STATUS: ${{ steps.health.outputs.result || 'failure' }}
          SHA: ${{ github.event.inputs.target_sha }}
          REASON: ${{ github.event.inputs.reason }}
        run: |
          if [ -z "$DISCORD_URL" ]; then exit 0; fi
          if [ "$STATUS" = "success" ]; then
            EMOJI="🔁"; MSG="Rollback succeeded"
          else
            EMOJI="🚨"; MSG="Rollback FAILED — manual intervention required"
          fi
          curl -fsSL -X POST -H "Content-Type: application/json" \
            --data "{\"content\":\"$EMOJI $MSG — rolled to \`${SHA:0:7}\` (reason: $REASON, run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)\"}" \
            "$DISCORD_URL"
