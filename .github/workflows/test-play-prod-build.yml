name: Test play prod build end to end (temporary)

# Temporary: the exact prod client build config of build-universe-images.yml (swap, 30 GB heap, hidden maps,
# Sentry upload with the repo secret), against a throw-away Sentry release. No image is pushed.
on:
  push:
    branches: [claude/project-thread-yhfwg0]
    paths:
      - '.github/workflows/test-play-prod-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fast
            fast: "true"
            release: v0.5.0-ci-maps-test-fast
          - name: full
            fast: ""
            release: v0.5.0-ci-maps-test-full
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4

      - name: Add swap for the prod client build
        run: |
          AVAIL=$(df --output=avail -BG / | tail -1 | tr -dc 0-9)
          SIZE=$(( AVAIL - 8 )); [ "$SIZE" -gt 32 ] && SIZE=32
          sudo swapoff -a || true
          sudo fallocate -l "${SIZE}G" /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          swapon --show
          free -m

      - name: Memory sampler
        run: |
          nohup bash -c 'while true; do echo "$(date +%H:%M:%S) $(free -m | awk "/Mem:/{printf \"ram_used=%sMB \", \$3} /Swap:/{printf \"swap_used=%sMB\", \$3}")"; sleep 60; done' > /tmp/mem.log 2>&1 &

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./play/Dockerfile.universe
          push: false
          load: true
          tags: play-test:local
          secrets: |
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
          build-args: |
            NODE_OPTIONS=--max-old-space-size=30720
            FAST_BUILD=${{ matrix.fast }}
            GENERATE_SOURCEMAP=hidden
            RELEASE_VERSION=${{ matrix.release }}
            SENTRY_URL=
            SENTRY_AUTH_TOKEN=
            SENTRY_ORG=
            SENTRY_PROJECT=
            SENTRY_ENVIRONMENT=

      - name: What the image contains
        if: always()
        run: |
          awk 'NR%5==1' /tmp/mem.log | tail -20
          docker run --rm --entrypoint sh play-test:local -c '
            cd /usr/src/play/dist/public
            echo "map files in image: $(find . -name "*.map" | wc -l)"
            echo "js files with a sourceMappingURL comment: $(grep -rl "sourceMappingURL=" --include=*.js assets | wc -l)"
            echo "js files with a debug id: $(grep -rl "debugId" --include=*.js assets | wc -l)"
            echo "legacy files: $(ls assets | grep -c legacy || true)"
          '

      - name: Delete the throw-away Sentry release
        if: always()
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: bawes-co
        run: npx -y @sentry/cli@3.4.3 releases delete ${{ matrix.release }} --project universe-play || true
