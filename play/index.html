        <script>
            // The installed app on an iPhone or iPad (opened from the Home Screen: navigator.standalone) runs under the
            // home bar, and iOS reports that space only with viewport-fit=cover. Held upright, turn it on so the bar and
            // the sheets at the bottom can keep clear of it (#941). Held sideways, iOS already keeps the page off the
            // notch without it, so the viewport stays as in the browser. Browsers never change.
            // The zoom guard (ViewportGuard.ts) rewrites the tag to undo a page zoom, from the content it read when it
            // started: whatever writes it, the fit is put back to match how the phone is held, the rest kept as is.
            (function () {
                if (navigator.standalone !== true || !window.matchMedia) return;
                var meta = document.querySelector('meta[name="viewport"]');
                if (!meta) return;
                var FIT = ", viewport-fit=cover";
                var upright = window.matchMedia("(orientation: portrait)");
                function apply() {
                    var content = (meta.getAttribute("content") || "").split(FIT).join("");
                    var wanted = upright.matches ? content + FIT : content;
                    if (meta.getAttribute("content") !== wanted) meta.setAttribute("content", wanted);
                }
                apply();
                if (upright.addEventListener) upright.addEventListener("change", apply);
                else if (upright.addListener) upright.addListener(apply);
                if (window.MutationObserver) {
                    new MutationObserver(apply).observe(meta, { attributes: true, attributeFilter: ["content"] });
                }
            })();
        </script>

        <style>
            /* The loading screen (#949, #981), painted before any script: Universe ink, the logo and one bar. It is the
               only loading screen: it stays from the first frame until the game is up, and comes back when the player
               changes room. The bar creeps to 20% on its own until the app reports real progress (BootSplash.ts), and
               only ever moves forward. Above the game's canvas; another first screen (sign-in, Woka picker, camera
               setup, an error) takes its place. */
            #boot-splash {
                position: fixed;
                inset: 0;
                z-index: 40;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 16px;
                background-color: #14121e;
                transition: opacity 300ms ease;
            }
            #boot-splash svg {
                display: block;
                width: 219px;
                height: 36px;
            }
            #boot-splash .boot-splash-bar {
                width: 160px;
                height: 4px;
                border-radius: 2px;
                overflow: hidden;
                background-color: rgba(255, 255, 255, 0.1);
            }
            /* The Universe gradient, as the main buttons in Orbit and the game. */
            #boot-splash .boot-splash-fill {
                width: 0;
                height: 100%;
                border-radius: 2px;
                background-image: linear-gradient(90deg, #8629fc, #4156f6);
                transition: width 400ms ease-out;
                animation: boot-splash-creep 3s cubic-bezier(0.2, 0.7, 0.3, 1) forwards;
            }
            @keyframes boot-splash-creep {
                to {
                    width: 20%;
                }
            }
            @media (prefers-reduced-motion: reduce) {
                #boot-splash .boot-splash-fill {
                    transition: none;
                    animation: none;
                }
            }
        </style>

        <script>
            if (localStorage && localStorage.getItem("debug_throttle")) {
                // This is a TEMPORARY TEST MODE that overloads setTimeout to detect when Chrome is throttling the page.
                // If you see this message in the console, it means that Chrome is throttling the page.
                console.info("Debug mode: setTimeout/setInterval are overloaded to detect when Chrome is throttling the page.")

                // To test, see: https://docs.google.com/document/d/11FhKHRcABGS4SWPFGwoL6g0ALMqrFKapCk5ZTKKupEk/edit
                // google-chrome --enable-features="IntensiveWakeUpThrottling:grace_period_seconds/10,OptOutZeroTimeoutTimersFromThrottling,AllowAggressiveThrottlingWithWebSocket"

                var _ = setTimeout;
                var __ = setInterval;
                window.setTimeout = function (callback, delay) {
                    const startTimestamp = Date.now();
                    return _(() => {
                        const endTimestamp = Date.now();
                        // If the delay is more than 500ms longer than expected, it means that Chrome throttled the page.
                        if (endTimestamp - startTimestamp > delay + 500) {
                            console.warn(
                                'setTimeout was throttled by Chrome! Delay was ' +
                                (endTimestamp - startTimestamp) +
                                'ms, but should have been ' +
                                delay +
                                'ms.'
                            );
                            console.trace();
                        }
                        callback();
                    }, delay);
                };
                window.setInterval = function (callback, delay) {
                    let timestamp = Date.now();
                    return __(() => {
                        const newTimestamp = Date.now();
                        if (newTimestamp - timestamp > delay + 500) {
                            console.warn(
                                'setInterval was throttled by Chrome! Delay was ' +
                                (newTimestamp - timestamp) +
                                'ms, but should have been ' +
                                delay +
                                'ms.'
                            );
                            console.trace();
                        }
                        timestamp = newTimestamp;
                        callback();
                    }, delay);
                };
            }
        </script>

        {{#logRocketId}}
            <!-- LogRocket -->
            <input type="hidden" id="log-rocket-id" value="{{ logRocketId }}">
            <input type="hidden" id="log-rocket-roomurl" value="{{ url }}">
            <script src="https://cdn.lr-in-prod.com/LogRocket.min.js" crossorigin="anonymous"></script>
            <script>
                console.info('Start LogRocket script!');
                window.addEventListener('DOMContentLoaded', (event) => {
                    const logRocketId = document.getElementById('log-rocket-id').value;
                    const roomUrl = document.getElementById('log-rocket-roomurl').value;
                    window.LogRocket && window.LogRocket.init(logRocketId);

                    // This is an example script - don't forget to change it!
                    window.LogRocket.identify("{{ userId }}", {
                        name: "{{ userId }}",
                        // Add your own custom user variables here, ie:
                        roomId: roomUrl
                    });
                });
            </script>
        {{/logRocketId}}

        {{#googleDrivePickerClientId}}
            <script type="text/javascript">
                window.pickerInited = false;
                window.gisInited = false;

                /**
                 * Callback after api.js is loaded.
                 */
                function gapiLoaded() {
                    gapi.load('client:picker', initializePicker);
                }

                /**
                 * Callback after the API client is loaded. Loads the
                 * discovery doc to initialize the API.
                 */
                async function initializePicker() {
                    await gapi.client.load('https://www.googleapis.com/discovery/v1/apis/drive/v3/rest');
                    pickerInited = true;
                }

                /**
                 * Callback after Google Identity Services are loaded.
                 */
                function gisLoaded() {
                    window.gisInited = true;
                }
            </script>
            <script async defer src="https://apis.google.com/js/api.js" onload="gapiLoaded()"></script>
            <script async defer src="https://accounts.google.com/gsi/client" onload="gisLoaded()"></script>
        {{/googleDrivePickerClientId}}
