<!-- 
Bawes Universe PWA meta tags — paste into play/index.html <head>
This file is a reference snippet, not a standalone page.
-->

<!-- PWA manifest -->
<link rel="manifest" href="/manifest.json" />

<!-- Theme colour (browser chrome, Android task switcher) -->
<meta name="theme-color" content="#4f98a3" />

<!-- iOS PWA -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Universe" />
<link rel="apple-touch-icon" href="/static/images/universe-apple-touch-icon.png" />

<!-- Open Graph -->
<meta property="og:type" content="website" />
<meta property="og:title" content="BAWES Universe" />
<meta property="og:description" content="Your persistent social world" />
<meta property="og:url" content="https://universe.bawes.net" />
<meta property="og:image" content="https://universe.bawes.net/static/images/universe-icon-512.png" />

<!-- Twitter card -->
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="BAWES Universe" />
<meta name="twitter:description" content="Your persistent social world" />
<meta name="twitter:image" content="https://universe.bawes.net/static/images/universe-icon-512.png" />
